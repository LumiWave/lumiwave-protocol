name: release-mainnet

on:
  push:
    tags:
      - "v*-mainnet"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Release (single-shot via goreleaser-cross)
        run: |
          docker run --rm \
            -v "${PWD}:/src" \
            -w /src \
            -e GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            -e COSMWASM_VERSION="v1.5.0" \
            -e TM_VERSION="v0.38.11" \
            goreleaser/goreleaser-cross:v1.25.5-v2.13.3 \
            goreleaser release --clean

