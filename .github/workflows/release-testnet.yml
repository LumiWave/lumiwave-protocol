name: release-testnet

on:
  push:
    tags:
      - "v*-testnet"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_linux:
    name: Build (Linux)
    if: startsWith(github.ref, 'refs/tags/v') && endsWith(github.ref_name, '-testnet')
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # linux-arm64 크로스 컴파일러
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build (linux only)
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.13.3
          args: release --snapshot --clean --config .github/goreleaser/goreleaser.linux.ci.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts (linux)
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            dist/*Linux*.tar.gz
            dist/SHA256SUMS-${{ github.ref_name }}-linux.txt

  build_macos:
    name: Build (macOS)
    if: startsWith(github.ref, 'refs/tags/v') && endsWith(github.ref_name, '-testnet')
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build (darwin only)
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.13.3
          args: release --snapshot --clean --config .github/goreleaser/goreleaser.darwin.ci.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts (darwin)
        uses: actions/upload-artifact@v4
        with:
          name: release-darwin
          path: |
            dist/*Darwin*.tar.gz
            dist/SHA256SUMS-${{ github.ref_name }}-darwin.txt

  create_release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') && endsWith(github.ref_name, '-testnet')
    runs-on: ubuntu-22.04
    needs:
      - build_linux
      - build_macos
    steps:
      - name: Download linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-linux
          path: release-artifacts/linux

      - name: Download darwin artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-darwin
          path: release-artifacts/darwin

      - name: Create release with artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: true
          draft: false
          files: |
            release-artifacts/linux/*.tar.gz
            release-artifacts/linux/SHA256SUMS-${{ github.ref_name }}-linux.txt
            release-artifacts/darwin/*.tar.gz
            release-artifacts/darwin/SHA256SUMS-${{ github.ref_name }}-darwin.txt
