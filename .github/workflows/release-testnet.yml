name: release-testnet

on:
  push:
    tags:
      - "v*-testnet"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Go build + mod
        uses: actions/cache@v4
        with:
          path: |
            .cache/go-build
            .cache/go-mod
            .cache/go-tmp
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Release (single-shot via goreleaser-cross)
        run: |
          mkdir -p .cache/go-mod .cache/go-build .cache/go-tmp
          docker run --rm --platform linux/amd64 \
            -v "${PWD}:/src" \
            -w /src \
            -e GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            -e COSMWASM_VERSION="v2.2.4" \
            -e TM_VERSION="v0.38.11" \
            -e GOFLAGS="-buildvcs=false" \
            -e GOMODCACHE="/src/.cache/go-mod" \
            -e GOCACHE="/src/.cache/go-build" \
            -e GOTMPDIR="/src/.cache/go-tmp" \
            goreleaser/goreleaser-cross:v1.25.5-v2.13.3 \
            release --clean --config /src/.goreleaser.yaml

